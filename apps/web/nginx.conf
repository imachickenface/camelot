# nginx serves the built website and forwards engine calls.
#
#   /          → the static website (with single-page-app fallback)
#   /api/...   → the engine (the "server" service on the Docker network)
#
# The /api block is tuned for the live activity feed (Server-Sent Events):
# buffering is off and timeouts are long so the stream stays open.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The website. Unknown paths fall back to index.html so the in-app router
    # (e.g. /settings) works on a hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The engine.
    location /api/ {
        proxy_pass http://server:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Keep Server-Sent Events flowing immediately and indefinitely.
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
