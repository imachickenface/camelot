# Camelot — runs the whole app with one command:
#
#     docker compose up
#
# Then open http://localhost:8080 in your browser.
#
# Two services:
#   - server : the engine (Node). Not exposed to your machine directly; the web
#              service talks to it privately over Docker's internal network.
#   - web    : the website (served by nginx), which also forwards /api calls to
#              the engine. This is the address you open.

services:
  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    environment:
      PORT: 4000
      CAMELOT_DATA_FILE: /data/agents.json
    volumes:
      # Saved agent customizations live here and survive restarts/rebuilds.
      - camelot-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  camelot-data:
